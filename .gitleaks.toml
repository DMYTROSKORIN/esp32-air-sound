# Extends the gitleaks default rules with the things that would identify this
# particular home network. The repository is meant to go public; none of these
# belong in it.
title = "esp32-air-sound"

[extend]
useDefault = true

[[rules]]
id = "private-lan-address"
description = "RFC1918 address of a specific home device"
regex = '''\b(10\.\d{1,3}\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}|172\.(1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3})\b'''
[rules.allowlist]
regexes = ['''192\.168\.4\.1''', '''10\.0\.0\.0''', '''192\.168\.0\.0''', '''\.0/(8|12|16|24)''']

[[rules]]
id = "mac-address"
description = "Hardware MAC address"
regex = '''\b([0-9A-Fa-f]{2}[:-]){5}[0-9A-Fa-f]{2}\b'''
[rules.allowlist]
regexes = ['''(?i)\b(00:00:00:00:00:00|ff:ff:ff:ff:ff:ff|aa:bb:cc:dd:ee:ff|de:ad:be:ef:[0-9a-f]{2}:[0-9a-f]{2})\b''']

[[rules]]
id = "wifi-credentials"
description = "Wi-Fi SSID or passphrase assigned in source or config"
regex = '''(?i)\b(wifi_?(ssid|pass(word|phrase)?)|ssid|psk)\b\s*[:=]\s*["'][^"']{3,}["']'''
[rules.allowlist]
regexes = ['''(?i)["'](your[-_ ]?(ssid|password|network)|example|changeme|xxx+|<[^>]+>)["']''']

[[rules]]
id = "personal-email"
description = "Personal e-mail address (only the committer identity is allowed)"
regex = '''[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}'''
[rules.allowlist]
regexes = ['''dev@skorin\.online''', '''noreply@github\.com''', '''example\.(com|org|net)''']

[allowlist]
paths = ['''\.gitleaks\.toml$''', '''^tools/check-private\.sh$''']
